---

services:
  s2-self-cert-server:
    build:
      dockerfile: ./docker/Dockerfile.server
    ports:
      - 8001:8001
    volumes:
      - ./s2-self-cert-server/src:/app/src
      - ./packages:/packages
    healthcheck:
      test: curl http://localhost:8001/healthcheck || exit 1
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 5s
