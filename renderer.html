<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S2 Self Certifier Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.37/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>

<body>
    <div id="app" class="container mt-5">
        <h1 class="mb-4">S2 Self Certifier Certificate</h1>
        <input type="file" @change="loadFile" class="form-control mb-4">

        <div class="card mb-3" v-if="device">
            <div class="card-body">
                <h3 class="card-title">Overview</h5>
                    <p class="card-text" v-if="timestamp"><strong>Timestamp</strong>: {{ timestamp }}</p>
                    <p class="card-text"><strong>Result:</strong> TODO</p>
            </div>
        </div>
        <div class="card mb-3" v-if="device">
            <div class="card-body">
                <h3 class="card-title">Device Information</h5>
                    <p class="card-text"><strong>Manufacturer:</strong> {{ device.manufacturer }}</p>
                    <p class="card-text"><strong>Name:</strong> {{ device.name }}</p>
            </div>
        </div>
        <div class="card card-body">
            <h3>Test Findings</h3>
            <div v-for="finding in findings" :key="finding.test">
                <hr>
                <h5 class="card-title">{{ finding.test }}</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" v-for="parameter in finding.parameters" :key="parameter.name">
                        <strong>{{ parameter.name }}</strong>: {{ parameter.status }}
                    </li>
                </ul>
                <p class="card-text mt-2"><strong>Status:</strong> {{ finding.status }}</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    device: null,
                    findings: [],
                    timestamp: null
                };
            },
            methods: {
                loadFile(event) {
                    const file = event.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const yamlData = e.target.result;
                        const data = jsyaml.load(yamlData);
                        this.device = data.device;
                        this.findings = data.findings;
                        this.timestamp = data.timestamp;
                    };
                    reader.readAsText(file);
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
